<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Browser mockup -->
  <rect x="20" y="20" width="360" height="260" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  
  <!-- Browser header -->
  <rect x="20" y="20" width="360" height="40" rx="8" fill="#f3f4f6"/>
  <rect x="20" y="52" width="360" height="1" fill="#e5e7eb"/>
  
  <!-- Traffic lights -->
  <circle cx="35" cy="40" r="5" fill="#ef4444"/>
  <circle cx="55" cy="40" r="5" fill="#f59e0b"/>
  <circle cx="75" cy="40" r="5" fill="#10b981"/>
  
  <!-- URL bar -->
  <rect x="100" y="30" width="200" height="20" rx="10" fill="white" stroke="#d1d5db"/>
  
  <!-- Website content -->
  <!-- Header -->
  <rect x="30" y="70" width="340" height="60" rx="6" fill="#3b82f6"/>
  <rect x="40" y="85" width="100" height="15" rx="3" fill="white"/>
  <rect x="280" y="80" width="80" height="25" rx="12" fill="white"/>
  
  <!-- Navigation -->
  <rect x="40" y="105" width="50" height="10" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="100" y="105" width="40" height="10" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="150" y="105" width="45" height="10" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="205" y="105" width="55" height="10" rx="2" fill="rgba(255,255,255,0.8)"/>
  
  <!-- Main content area -->
  <rect x="40" y="150" width="200" height="100" rx="8" fill="#f1f5f9"/>
  <rect x="50" y="165" width="120" height="12" rx="2" fill="#1f2937"/>
  <rect x="50" y="185" width="160" height="8" rx="1" fill="#6b7280"/>
  <rect x="50" y="198" width="140" height="8" rx="1" fill="#6b7280"/>
  <rect x="50" y="211" width="100" height="8" rx="1" fill="#6b7280"/>
  <rect x="50" y="230" width="80" height="15" rx="7" fill="#3b82f6"/>
  
  <!-- Sidebar -->
  <rect x="260" y="150" width="100" height="100" rx="8" fill="#fff7ed"/>
  <rect x="270" y="165" width="60" height="10" rx="2" fill="#ea580c"/>
  <rect x="270" y="185" width="70" height="6" rx="1" fill="#9a3412"/>
  <rect x="270" y="195" width="50" height="6" rx="1" fill="#9a3412"/>
  <rect x="270" y="210" width="80" height="30" rx="6" fill="#fed7aa"/>
  
  <!-- Features section -->
  <rect x="40" y="260" width="80" height="15" rx="3" fill="#dcfce7"/>
  <rect x="130" y="260" width="80" height="15" rx="3" fill="#dbeafe"/>
  <rect x="220" y="260" width="80" height="15" rx="3" fill="#fef3c7"/>
  <rect x="310" y="260" width="50" height="15" rx="3" fill="#fce7f3"/>
  
  <!-- Performance indicators -->
  <circle cx="350" cy="100" r="15" fill="#10b981"/>
  <text x="350" y="105" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">A+</text>
  
  <text x="200" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">Desktop Version - Before</text>
</svg>