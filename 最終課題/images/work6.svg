<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#f8fafc"/>
  
  <!-- Dashboard container -->
  <rect x="20" y="20" width="360" height="210" rx="12" fill="white" stroke="#e5e7eb"/>
  
  <!-- Sidebar -->
  <rect x="20" y="20" width="80" height="210" rx="12" fill="#1f2937"/>
  <rect x="20" y="20" width="80" height="40" rx="12" fill="#374151"/>
  
  <!-- Logo area -->
  <circle cx="45" cy="40" r="8" fill="#3b82f6"/>
  <rect x="58" y="35" width="30" height="10" rx="2" fill="white"/>
  
  <!-- Navigation items -->
  <rect x="30" y="70" width="60" height="25" rx="6" fill="#3b82f6"/>
  <circle cx="40" cy="82" r="4" fill="white"/>
  <rect x="48" y="79" width="30" height="6" rx="1" fill="white"/>
  
  <rect x="30" y="100" width="60" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
  <circle cx="40" cy="110" r="3" fill="rgba(255,255,255,0.7)"/>
  <rect x="48" y="108" width="25" height="4" rx="1" fill="rgba(255,255,255,0.7)"/>
  
  <rect x="30" y="125" width="60" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
  <circle cx="40" cy="135" r="3" fill="rgba(255,255,255,0.7)"/>
  <rect x="48" y="133" width="25" height="4" rx="1" fill="rgba(255,255,255,0.7)"/>
  
  <!-- Main content area -->
  <rect x="110" y="30" width="260" height="30" rx="4" fill="#f8fafc"/>
  <rect x="120" y="38" width="80" height="14" rx="2" fill="#1f2937"/>
  <rect x="330" y="35" width="30" height="20" rx="10" fill="#3b82f6"/>
  
  <!-- Stats cards -->
  <rect x="120" y="75" width="70" height="50" rx="6" fill="#dbeafe"/>
  <rect x="125" y="85" width="30" height="12" rx="2" fill="#3b82f6"/>
  <rect x="125" y="102" width="20" height="8" rx="1" fill="#1e40af"/>
  <text x="135" y="118" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#1e40af" text-anchor="middle">Users</text>
  
  <rect x="200" y="75" width="70" height="50" rx="6" fill="#dcfce7"/>
  <rect x="205" y="85" width="35" height="12" rx="2" fill="#10b981"/>
  <rect x="205" y="102" width="25" height="8" rx="1" fill="#059669"/>
  <text x="215" y="118" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#059669" text-anchor="middle">Revenue</text>
  
  <rect x="280" y="75" width="70" height="50" rx="6" fill="#fef3c7"/>
  <rect x="285" y="85" width="40" height="12" rx="2" fill="#f59e0b"/>
  <rect x="285" y="102" width="30" height="8" rx="1" fill="#d97706"/>
  <text x="295" y="118" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#d97706" text-anchor="middle">Orders</text>
  
  <!-- Chart area -->
  <rect x="120" y="140" width="150" height="80" rx="6" fill="#f9fafb"/>
  
  <!-- Chart lines -->
  <polyline points="130,200 140,180 150,185 160,165 170,170 180,150 190,155 200,140 210,145 220,130 230,135 240,120 250,125 260,110" 
            stroke="#3b82f6" stroke-width="2" fill="none"/>
  <polyline points="130,205 140,195 150,190 160,185 170,180 180,175 190,170 200,165 210,160 220,155 230,150 240,145 250,140 260,135" 
            stroke="#10b981" stroke-width="2" fill="none"/>
  
  <!-- Chart dots -->
  <circle cx="180" cy="150" r="3" fill="#3b82f6"/>
  <circle cx="220" cy="130" r="3" fill="#3b82f6"/>
  <circle cx="190" cy="170" r="3" fill="#10b981"/>
  <circle cx="230" cy="150" r="3" fill="#10b981"/>
  
  <!-- Right panel -->
  <rect x="280" y="140" width="70" height="80" rx="6" fill="#f3f4f6"/>
  <rect x="285" y="150" width="40" height="8" rx="2" fill="#6b7280"/>
  <rect x="285" y="162" width="50" height="6" rx="1" fill="#9ca3af"/>
  <rect x="285" y="172" width="35" height="6" rx="1" fill="#9ca3af"/>
  <rect x="285" y="182" width="45" height="6" rx="1" fill="#9ca3af"/>
  
  <!-- Progress bars -->
  <rect x="285" y="195" width="60" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="285" y="195" width="35" height="4" rx="2" fill="#3b82f6"/>
  <rect x="285" y="205" width="60" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="285" y="205" width="45" height="4" rx="2" fill="#10b981"/>
  <rect x="285" y="215" width="60" height="4" rx="2" fill="#e5e7eb"/>
  <rect x="285" y="215" width="25" height="4" rx="2" fill="#f59e0b"/>
  
  <text x="200" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">Web Application</text>
</svg>