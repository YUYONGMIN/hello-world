<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#fefefe"/>
  
  <!-- Main logo area -->
  <rect x="150" y="60" width="100" height="100" rx="50" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Primary logo design -->
  <circle cx="200" cy="110" r="30" fill="#3b82f6"/>
  <rect x="185" y="95" width="30" height="30" rx="4" fill="white"/>
  <circle cx="200" cy="110" r="8" fill="#3b82f6"/>
  <rect x="192" y="102" width="16" height="16" rx="2" fill="white"/>
  
  <!-- Logo variations -->
  <rect x="50" y="50" width="60" height="60" rx="8" fill="#f8fafc"/>
  <circle cx="80" cy="80" r="15" fill="#6366f1"/>
  <rect x="75" y="75" width="10" height="10" rx="2" fill="white"/>
  
  <rect x="290" y="50" width="60" height="60" rx="8" fill="#f8fafc"/>
  <rect x="305" y="65" width="30" height="30" rx="15" fill="#10b981"/>
  <circle cx="320" cy="80" r="8" fill="white"/>
  
  <!-- Color palette -->
  <circle cx="80" cy="150" r="12" fill="#3b82f6"/>
  <circle cx="110" cy="150" r="12" fill="#6366f1"/>
  <circle cx="140" cy="150" r="12" fill="#8b5cf6"/>
  <circle cx="170" cy="150" r="12" fill="#ec4899"/>
  
  <circle cx="230" cy="180" r="12" fill="#10b981"/>
  <circle cx="260" cy="180" r="12" fill="#f59e0b"/>
  <circle cx="290" cy="180" r="12" fill="#ef4444"/>
  <circle cx="320" cy="180" r="12" fill="#6b7280"/>
  
  <!-- Typography samples -->
  <rect x="50" y="180" width="100" height="50" rx="6" fill="#f9fafb"/>
  <rect x="55" y="185" width="60" height="8" rx="2" fill="#1f2937"/>
  <rect x="55" y="198" width="40" height="6" rx="1" fill="#6b7280"/>
  <rect x="55" y="208" width="50" height="6" rx="1" fill="#6b7280"/>
  <rect x="55" y="218" width="35" height="6" rx="1" fill="#9ca3af"/>
  
  <!-- Business card mockup -->
  <rect x="270" y="120" width="80" height="50" rx="4" fill="white" stroke="#e5e7eb"/>
  <circle cx="285" cy="135" r="6" fill="#3b82f6"/>
  <rect x="295" y="130" width="30" height="4" rx="1" fill="#1f2937"/>
  <rect x="295" y="138" width="40" height="3" rx="1" fill="#6b7280"/>
  <rect x="295" y="145" width="25" height="3" rx="1" fill="#6b7280"/>
  <rect x="285" y="155" width="50" height="2" rx="1" fill="#d1d5db"/>
  <rect x="285" y="160" width="35" height="2" rx="1" fill="#d1d5db"/>
  
  <!-- Grid guide lines -->
  <line x1="40" y1="40" x2="360" y2="40" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="40" y1="210" x2="360" y2="210" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="40" y1="40" x2="40" y2="210" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="360" y1="40" x2="360" y2="210" stroke="#f3f4f6" stroke-width="1"/>
  
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Brand Identity</text>
  <text x="80" y="135" font-family="Arial, sans-serif" font-size="8" fill="#6b7280" text-anchor="middle">Colors</text>
</svg>