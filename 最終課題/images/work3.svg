<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#f8fafc"/>
  
  <!-- Phone mockup -->
  <rect x="150" y="20" width="100" height="180" rx="15" fill="#1f2937"/>
  <rect x="155" y="30" width="90" height="160" rx="8" fill="#ffffff"/>
  
  <!-- Status bar -->
  <rect x="160" y="35" width="20" height="8" rx="2" fill="#000000"/>
  <rect x="230" y="35" width="10" height="8" rx="2" fill="#10b981"/>
  
  <!-- App header -->
  <rect x="160" y="50" width="80" height="20" rx="4" fill="#3b82f6"/>
  <circle cx="165" cy="60" r="3" fill="white"/>
  <rect x="175" y="57" width="40" height="6" rx="3" fill="white"/>
  <circle cx="235" cy="60" r="3" fill="white"/>
  
  <!-- Main content -->
  <rect x="160" y="80" width="80" height="60" rx="8" fill="#f3f4f6"/>
  <circle cx="200" cy="100" r="12" fill="#8b5cf6"/>
  <rect x="180" y="118" width="40" height="8" rx="2" fill="#6b7280"/>
  <rect x="185" y="130" width="30" height="6" rx="1" fill="#9ca3af"/>
  
  <!-- Buttons -->
  <rect x="165" y="155" width="30" height="20" rx="10" fill="#ef4444"/>
  <rect x="205" y="155" width="30" height="20" rx="10" fill="#10b981"/>
  
  <!-- Bottom navigation -->
  <rect x="160" y="180" width="80" height="5" rx="2" fill="#e5e7eb"/>
  <circle cx="175" cy="182" r="2" fill="#3b82f6"/>
  <circle cx="190" cy="182" r="2" fill="#d1d5db"/>
  <circle cx="205" cy="182" r="2" fill="#d1d5db"/>
  <circle cx="220" cy="182" r="2" fill="#d1d5db"/>
  
  <!-- Side elements -->
  <rect x="50" y="60" width="80" height="40" rx="8" fill="#dbeafe"/>
  <rect x="55" y="70" width="30" height="8" rx="2" fill="#3b82f6"/>
  <rect x="55" y="82" width="50" height="6" rx="1" fill="#6b7280"/>
  
  <rect x="270" y="120" width="80" height="50" rx="8" fill="#fef3c7"/>
  <rect x="275" y="130" width="35" height="10" rx="2" fill="#f59e0b"/>
  <rect x="275" y="145" width="60" height="6" rx="1" fill="#92400e"/>
  <rect x="275" y="155" width="45" height="6" rx="1" fill="#92400e"/>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="40" r="3" fill="#ec4899"/>
  <circle cx="320" cy="60" r="4" fill="#14b8a6"/>
  <circle cx="80" cy="180" r="2" fill="#8b5cf6"/>
  <circle cx="340" cy="190" r="3" fill="#f59e0b"/>
  
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">Mobile App UI</text>
</svg>