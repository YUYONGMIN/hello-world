<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#ffffff"/>
  
  <!-- Browser window -->
  <rect x="30" y="30" width="340" height="190" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  
  <!-- Browser header -->
  <rect x="30" y="30" width="340" height="30" rx="8" fill="#f3f4f6"/>
  <rect x="30" y="52" width="340" height="1" fill="#e5e7eb"/>
  
  <!-- Traffic lights -->
  <circle cx="45" cy="45" r="4" fill="#ef4444"/>
  <circle cx="60" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="75" cy="45" r="4" fill="#10b981"/>
  
  <!-- URL bar -->
  <rect x="100" y="37" width="200" height="16" rx="8" fill="white" stroke="#d1d5db"/>
  <rect x="105" y="41" width="100" height="8" rx="2" fill="#e5e7eb"/>
  
  <!-- Landing page header -->
  <rect x="40" y="70" width="320" height="50" rx="6" fill="#3b82f6"/>
  <rect x="50" y="80" width="80" height="12" rx="2" fill="white"/>
  <rect x="280" y="85" width="60" height="20" rx="10" fill="white"/>
  <text x="310" y="96" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#3b82f6" text-anchor="middle">Sign Up</text>
  
  <!-- Hero section -->
  <rect x="50" y="100" width="140" height="8" rx="2" fill="white"/>
  <rect x="50" y="112" width="100" height="6" rx="1" fill="rgba(255,255,255,0.8)"/>
  
  <!-- Main content -->
  <rect x="50" y="135" width="300" height="60" rx="8" fill="white"/>
  <rect x="60" y="145" width="120" height="12" rx="2" fill="#1f2937"/>
  <rect x="60" y="162" width="200" height="6" rx="1" fill="#6b7280"/>
  <rect x="60" y="172" width="180" height="6" rx="1" fill="#6b7280"/>
  
  <!-- Feature boxes -->
  <rect x="200" y="145" width="60" height="40" rx="6" fill="#f3f4f6"/>
  <circle cx="215" cy="160" r="6" fill="#10b981"/>
  <rect x="208" y="170" width="14" height="4" rx="1" fill="#6b7280"/>
  
  <rect x="270" y="145" width="60" height="40" rx="6" fill="#f3f4f6"/>
  <circle cx="285" cy="160" r="6" fill="#3b82f6"/>
  <rect x="278" y="170" width="14" height="4" rx="1" fill="#6b7280"/>
  
  <!-- CTA button -->
  <rect x="150" y="205" width="100" height="30" rx="15" fill="#ef4444"/>
  <text x="200" y="222" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">Get Started</text>
  
  <!-- Side decorations -->
  <rect x="10" y="80" width="15" height="60" rx="3" fill="#dbeafe"/>
  <rect x="375" y="100" width="15" height="40" rx="3" fill="#fef3c7"/>
  
  <!-- Metrics/stats -->
  <circle cx="100" cy="20" r="8" fill="#10b981"/>
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle">+25%</text>
  
  <circle cx="300" cy="20" r="8" fill="#3b82f6"/>
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle">CVR</text>
  
  <text x="200" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">Landing Page</text>
</svg>