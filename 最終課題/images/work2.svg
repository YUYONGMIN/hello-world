<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#fafafa"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="400" height="40" fill="#1f2937"/>
  
  <!-- Search bar -->
  <rect x="20" y="50" width="200" height="30" rx="15" fill="#f3f4f6" stroke="#d1d5db"/>
  <circle cx="35" cy="65" r="6" fill="#9ca3af"/>
  <rect x="45" y="62" width="60" height="6" rx="3" fill="#d1d5db"/>
  
  <!-- Shopping cart -->
  <rect x="340" y="55" width="20" height="20" rx="3" fill="#ef4444"/>
  <circle cx="343" cy="58" r="2" fill="white"/>
  <text x="355" y="67" font-family="Arial, sans-serif" font-size="8" font-weight="600" fill="#ef4444">3</text>
  
  <!-- Product grid -->
  <rect x="20" y="100" width="110" height="120" rx="8" fill="white" stroke="#e5e7eb"/>
  <rect x="25" y="105" width="100" height="70" rx="4" fill="#f8fafc"/>
  <rect x="25" y="185" width="60" height="12" rx="2" fill="#374151"/>
  <rect x="25" y="203" width="40" height="10" rx="2" fill="#10b981"/>
  
  <rect x="145" y="100" width="110" height="120" rx="8" fill="white" stroke="#e5e7eb"/>
  <rect x="150" y="105" width="100" height="70" rx="4" fill="#fef3c7"/>
  <rect x="150" y="185" width="70" height="12" rx="2" fill="#374151"/>
  <rect x="150" y="203" width="50" height="10" rx="2" fill="#3b82f6"/>
  
  <rect x="270" y="100" width="110" height="120" rx="8" fill="white" stroke="#e5e7eb"/>
  <rect x="275" y="105" width="100" height="70" rx="4" fill="#fce7f3"/>
  <rect x="275" y="185" width="80" height="12" rx="2" fill="#374151"/>
  <rect x="275" y="203" width="45" height="10" rx="2" fill="#f59e0b"/>
  
  <!-- Decorative elements -->
  <rect x="25" y="10" width="60" height="20" rx="4" fill="#3b82f6"/>
  <text x="55" y="22" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="white" text-anchor="middle">SHOP</text>
  
  <!-- Stars for ratings -->
  <polygon points="30,180 32,186 38,186 33,190 35,196 30,192 25,196 27,190 22,186 28,186" fill="#fbbf24"/>
  <polygon points="155,180 157,186 163,186 158,190 160,196 155,192 150,196 152,190 147,186 153,186" fill="#fbbf24"/>
  <polygon points="280,180 282,186 288,186 283,190 285,196 280,192 275,196 277,190 272,186 278,186" fill="#fbbf24"/>
  
  <text x="200" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle">E-Commerce Platform</text>
</svg>